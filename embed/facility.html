<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside the lab · AI Research Center</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/site.css">
<script type="module" src="../js/embed.js"></script>
</head>
<body class="embed light" data-widget="facility" data-theme="light">
<main>
<div class="facility" id="facility3d" data-src="">
    <div class="fac-stage">
      <canvas class="fac-canvas" aria-hidden="true"></canvas>
      <div class="fac-labels" aria-hidden="true"></div>
      <div class="fac-tip" role="status" hidden></div>
      <div class="fac-loading" aria-hidden="true"><span></span>Loading the facility model</div>
      <div class="fac-fallback"><img src="../img/facility-poster.jpg" alt="Cutaway model of the facility: radiochemistry, imaging hall, pathology and spatial biology, data centre, knowledge core, science hub and automated lab" loading="lazy"><p>The interactive model needs WebGL. The steps of the loop are listed alongside.</p></div>
      <div class="fac-hint"><span class="h-mouse">Drag to rotate · scroll to zoom · select a room</span><span class="h-touch">Swipe sideways to rotate · pinch to zoom · tap a room</span></div>
      <div class="fac-tools" role="group" aria-label="View">
        <button type="button" class="icon-btn fac-reset" title="Reset view"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 1.8v4h4z"/></svg><span>Reset</span></button>
        <button type="button" class="icon-btn fac-flow" aria-pressed="true" title="Pause or resume motion"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="2"/><circle cx="13" cy="4" r="2"/><circle cx="13" cy="12" r="2"/><path d="M5 8l6-3.5M5 8l6 3.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span>Motion</span></button>
      </div>
    </div>
    <aside class="fac-panel" aria-live="polite">
      <div class="fac-tour">
        <p class="eyebrow">The loop, step by step</p>
        <ol class="fac-steps"></ol>
        <div class="fac-nav">
          <button type="button" class="btn btn-primary fac-next">Start the tour</button>
        </div>
      </div>
      <div class="fac-detail" hidden>
        <p class="eyebrow fac-detail-kicker"></p>
        <h3 class="fac-detail-title" tabindex="-1"></h3>
        <div class="fac-detail-body"></div>
        <div class="fac-nav"><button type="button" class="btn fac-dprev">Back</button><button type="button" class="btn btn-primary fac-dnext">Next</button></div>
        <button type="button" class="btn fac-close">All steps</button>
      </div>
    </aside>
  </div>
</main>
</body>
</html>
